# Render Blueprint for the chatbot's Python RAG server (rag-backend/).
# Render -> New -> Blueprint -> pick this repo. Secrets marked `sync: false` are asked for in the dashboard.
services:
  - type: web
    name: bean-scene-rag
    runtime: python
    plan: free
    rootDir: rag-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bean_rag.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SUPABASE_URL
        value: https://mxkdjqssgizqvgkbruvc.supabase.co
      - key: CORS_ORIGINS
        value: https://cofee-website-alpha.vercel.app,http://localhost:5173
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
